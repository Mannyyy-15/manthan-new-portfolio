<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Football Jersey Spin - Manthan Sawant #04</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #06070a;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* Background subtle spotlight & anime grid */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0, 240, 255, 0.05) 50%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    #jersey-3d-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }
    #jersey-3d-stage:active {
      cursor: grabbing;
    }

    /* Floating Kit Switcher HUD */
    .kit-switcher-hud {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(10, 14, 24, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 1rem 1.4rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      max-width: 95vw;
    }

    .kit-hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.5rem;
    }
    .hud-pill-tag {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }
    .hud-kit-name {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ffd700;
    }

    .kit-buttons-grid {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .kit-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      color: #e0e0e0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .kit-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .kit-btn.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(0, 240, 255, 0.15));
      border: 1px solid #d4af37;
      color: #fff;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }
    .kit-icon {
      font-size: 1.2rem;
    }
    .kit-label {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .kit-sub {
      font-size: 0.62rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .kit-hud-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.6);
      padding-top: 0.3rem;
      gap: 1rem;
    }
    .hud-hint {
      letter-spacing: 0.08em;
    }
    .hud-action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 4px 10px;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hud-action-btn:hover {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }
    .hud-action-btn.active {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      color: #00f0ff;
    }

    /* Top branding watermark */
    .top-badge {
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .top-badge-title {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #fff;
    }
    .top-badge-sub {
      font-size: 0.75rem;
      color: #00f0ff;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="top-badge">
    <div class="top-badge-title">#04 MANTHAN SAWANT</div>
    <div class="top-badge-sub">3D JERSEY ARSENAL // 覚醒・領域展開</div>
  </div>

  <div id="jersey-3d-stage"></div>

  <div class="kit-switcher-hud">
    <div class="kit-hud-header">
      <span class="hud-pill-tag">KIT VAULT // 装備選択</span>
      <span class="hud-kit-name" id="hud-active-kit-title">REAL MADRID (White & Gold // 👑 ギャラクティコ)</span>
    </div>
    <div class="kit-buttons-grid">
      <button class="kit-btn active" data-kit="real_madrid">
        <span class="kit-icon">👑</span>
        <span class="kit-label">REAL MADRID</span>
        <span class="kit-sub">White & Gold</span>
      </button>
      <button class="kit-btn" data-kit="blue_lock">
        <span class="kit-icon">⚡</span>
        <span class="kit-label">BLUE LOCK</span>
        <span class="kit-sub">Cyber Blue</span>
      </button>
      <button class="kit-btn" data-kit="man_utd">
        <span class="kit-icon">🔴</span>
        <span class="kit-label">MAN UTD</span>
        <span class="kit-sub">Red & Black</span>
      </button>
      <button class="kit-btn" data-kit="sporting">
        <span class="kit-icon">🟢</span>
        <span class="kit-label">SPORTING CP</span>
        <span class="kit-sub">Green & White</span>
      </button>
      <button class="kit-btn" data-kit="santos">
        <span class="kit-icon">⚪</span>
        <span class="kit-label">SANTOS FC</span>
        <span class="kit-sub">Black & White</span>
      </button>
    </div>
    <div class="kit-hud-controls">
      <span class="hud-hint">⟲ DRAG TO ROTATE 360° // SCROLL TO SPIN</span>
      <div>
        <button id="btn-spin-360" class="hud-action-btn">SPIN 360° ↺</button>
        <button id="btn-toggle-auto" class="hud-action-btn active">AUTO SPIN: ON</button>
      </div>
    </div>
  </div>

  <script src="./js/three.min.js"></script>
  <script src="./js/jersey-3d.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new JerseyViewer('jersey-3d-stage');
    });
  </script>
</body>
</html>
